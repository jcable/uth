name: Gh-Pages
permissions:
  pages: write
  contents: write
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
            workingDir: uth