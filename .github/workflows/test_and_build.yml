name: test and build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: uth
      - run: |
          mkdir auth
          echo 'const apiToken="";' > auth/secrets.dart
        working-directory: uth/lib
      - run: flutter test --coverage
        working-directory: uth
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: flutter-coverage
          path: uth/coverage/lcov.info

  build-apks:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: uth
      - name: build
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          mkdir auth
          echo "const apiToken=\"$API_TOKEN\";" > auth/secrets.dart
        working-directory: uth/lib
      - run: flutter build apk --release --split-per-abi
        working-directory: uth
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: uth-android-apks
          path: uth/build/app/outputs/flutter-apk/app-*-release.apk
