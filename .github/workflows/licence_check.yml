name: GPL & License Compliance Check

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  scan-licenses:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./uth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Check pubspec.yaml & Dart/Flutter dependencies for copyleft licenses
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter package licenses
        run: |
          dart pub global activate legal
          dart pub global run legal check

      # 2. Scan Dart source files for inline AI-written GPL headers/snippets
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ScanCode Toolkit
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install scancode-toolkit

      - name: run scan code
        run: |
          scancode -cl --only-findings --json-pp scan-results.json lib/

      - name: create report
        run: |
          python -c '
          import json, sys
          with open("scan-results.json") as f:
              data = json.load(f)
          gpl_hits = []
          for file in data.get("files", []):
              for lic in file.get("license_detections", []):
                  expr = lic.get("license_expression", "").lower()
                  if any(k in expr for k in ["gpl", "agpl", "lgpl", "copyleft"]):
                      gpl_hits.append((file["path"], expr))
          if gpl_hits:
              print("ERROR: Copyleft/GPL clues detected in source files:")
              for path, expr in gpl_hits:
                  print(f" - {path}: {expr}")
              sys.exit(1)
          print("No GPL/copyleft clues detected in lib/.")
          '

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scancode-license-report
          path: scan-results.json
